<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Film-Geek — Host</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%224%22 y=%224%22 width=%2292%22 height=%2292%22 rx=%2218%22 fill=%22%230a0a0c%22 stroke=%22%23d64545%22 stroke-width=%226%22/><text x=%2250%22 y=%2263%22 font-size=%2252%22 text-anchor=%22middle%22>📺</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="player-wrap">
  <div id="yt-player"></div>
  <!-- Some official/studio-partner YouTube channels force their title,
       channel name, and "watch on YouTube" branding to show regardless
       of embed parameters (controls=0 etc. get ignored) — these bars are
       a permanent safety net that physically covers where that branding
       tends to render, independent of any per-video setting. -->
  <div id="brand-mask-top"></div>
  <div id="brand-mask-bottom"></div>
</div>

<div id="hud" hidden>
  <span id="timer">10</span>s
  <button id="stop-early-btn">Stop clip</button>
</div>

<div id="cover" class="cover">
  <div class="cover-inner">
    <div class="logo">🎬 Film-Geek</div>

    <div id="room-info" class="room-info">
      <p>Join at <strong>vadimdroz.github.io/Film-Geek/player/</strong> with room code</p>
      <p class="room-code" id="room-code-display">----</p>
      <p id="player-count" class="hint"></p>
      <p id="round-indicator" class="hint"></p>
      <p id="turn-indicator" class="queue-status"></p>
    </div>

    <div id="idle-panel">
      <p id="queue-status" class="queue-status"></p>
      <button id="start-btn" class="giant-btn" disabled>Loading player…</button>
    </div>

    <div id="error-panel" hidden>
      <p id="error-message" class="queue-status"></p>
      <button id="error-skip-btn" class="giant-btn">Skip this clip →</button>
    </div>

    <div id="no-clips-panel" hidden>
      <p>No clips tagged yet.</p>
      <p class="hint">Tag some in the admin tool (same browser, same origin), or import a JSON export below.</p>
      <label class="import-label">Import JSON
        <input type="file" id="import-input" accept="application/json" hidden />
      </label>
    </div>

    <div id="ended-panel" hidden>
      <p class="queue-status">Answer on your phones!</p>
      <p id="guess-timer" class="room-code">60</p>
      <p id="guess-count" class="queue-status"></p>
      <button id="reveal-btn" class="giant-btn">Reveal answer</button>
    </div>

    <div id="answer-panel" hidden>
      <h1 id="answer-title"></h1>
      <div id="answer-meta" class="answer-meta"></div>
      <div id="results-list" class="results-list"></div>
      <button id="next-btn" class="giant-btn">Next clip →</button>
    </div>

    <div id="all-done-panel" hidden>
      <p>That's every clip in the library.</p>
      <button id="reshuffle-btn" class="giant-btn">Reshuffle &amp; play again</button>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module" src="app.js"></script>
</body>
</html>
